<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baccarat V20 Mobile</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#0f172a;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:16px 16px 120px;
}
.container{
    max-width:700px;
    margin:auto;
}
.card{
    background:#1e293b;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
}
h1{
    text-align:center;
    margin-bottom:15px;
}
.big{
    font-size:34px;
    font-weight:bold;
    text-align:center;
}
textarea{
    width:100%;
    min-height:90px;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#334155;
    color:#fff;
    margin-top:10px;
}
#dock{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    border-radius:18px;
    padding:10px;
    display:flex;
    gap:8px;
    box-shadow:0 0 15px rgba(0,0,0,.5);
    touch-action:none;
}
#dock button{
    border:none;
    padding:12px;
    border-radius:10px;
    color:#fff;
}
.b{background:#dc2626;}
.p{background:#2563eb;}
.t{background:#16a34a;}
.g{background:#374151;}
</style>
</head>
<body>

<div class="container">

<h1>🧠 Baccarat V20 Mobile</h1>

<div class="card">
<div class="big" id="recommend">-</div>
<br>
Confidence: <span id="confidence">0%</span><br>
Zone: <span id="zone">-</span>
</div>

<div class="card">
Dragon: <span id="dragon">-</span><br>
Pingpong: <span id="pingpong">-</span><br>
Two-Cut: <span id="twocut">-</span><br>
Trap: <span id="trap">-</span><br>
DNA12: <span id="dna">-</span>
</div>

<div class="card">
P1: <span id="p1"></span><br>
P2: <span id="p2"></span><br>
P3: <span id="p3"></span><br>
P4: <span id="p4"></span><br>
TOP: <span id="top"></span>
</div>

<div class="card">
RAW<br>
<div id="raw"></div>
<br>
CLEAN<br>
<div id="clean"></div>
<br>
GROUPS<br>
<div id="groups"></div>
</div>

<div class="card">
History
<hr><br>
<div id="history"></div>
</div>

<div class="card">
Backtest
<hr><br>
<div id="backtest"></div>
</div>

<div class="card">
Bulk Input
<textarea id="bulkInput"
placeholder="BPPTBBPPBBP"></textarea>

<button onclick="importPattern()"
style="margin-top:10px;width:100%;padding:12px;">
Import
</button>
</div>

</div>
<div id="dock">

<button class="b"
onclick="add('B')">
🔴
</button>

<button class="p"
onclick="add('P')">
🔵
</button>

<button class="t"
onclick="add('T')">
🟢
</button>

<button class="g"
onclick="undo()">
↩
</button>

<button class="g"
onclick="resetAll()">
✕
</button>

</div>
<script>

let history=
JSON.parse(
localStorage.getItem(
"baccarat"
)||"[]"
);

function save(){
localStorage.setItem(
"baccarat",
JSON.stringify(history)
);
}

function add(v){
history.push(v);
save();
render();
}

function undo(){
history.pop();
save();
render();
}

function resetAll(){
history=[];
save();
render();
}

function importPattern(){

let txt=
document
.getElementById(
"bulkInput"
).value
.toUpperCase()
.replace(/[^BPT]/g,'');

history=txt.split('');
save();
render();
}

function clean(){
return history
.filter(x=>x!=="T")
.join('');
}

function groups(){

let s=clean();

if(!s)return "";

let out=[];
let c=1;

for(let i=1;i<=s.length;i++){

if(s[i]===s[i-1]){
c++;
}else{
out.push(
s[i-1]+c
);
c=1;
}
}

return out.join("-");
}

const dragon=()=>
/BBB|PPP/.test(
clean().slice(-3)
);

const pingpong=()=>
["BPBPBP","PBPBPB"]
.includes(
clean().slice(-6)
);

const twoCut=()=>
/BBPPBB|PPBBPP/
.test(
clean().slice(-8)
);

const trap=()=>{

let s=
clean().slice(-4);

return(
s==="BBBP"||
s==="PPPB"
);

};

function confidence(){

let score=50;

if(dragon())score+=15;
if(pingpong())score+=8;
if(twoCut())score+=8;
if(trap())score-=15;

return Math.max(
0,
Math.min(100,score)
);

}

function zone(){

let c=
confidence();

if(c>=70)
return "SAFE";

if(c>=60)
return "RISK";

return "TRAP";
}

function recommend(){

let c=
confidence();

if(c<60)
return "WAIT";

let s=
clean();

if(
s.endsWith("BBB")
)
return "BANKER";

if(
s.endsWith("PPP")
)
return "PLAYER";

return "WAIT";
}

function dna12(){

return clean()
.slice(-12);

}
function render(){

document.getElementById(
"recommend"
).innerHTML=
recommend();

document.getElementById(
"confidence"
).innerHTML=
confidence()+"%";

document.getElementById(
"zone"
).innerHTML=
zone();

document.getElementById(
"dragon"
).innerHTML=
dragon();

document.getElementById(
"pingpong"
).innerHTML=
pingpong();

document.getElementById(
"twocut"
).innerHTML=
twoCut();

document.getElementById(
"trap"
).innerHTML=
trap();

document.getElementById(
"dna"
).innerHTML=
dna12();

document.getElementById(
"raw"
).innerHTML=
history.join("");

document.getElementById(
"clean"
).innerHTML=
clean();

document.getElementById(
"groups"
).innerHTML=
groups();

document.getElementById(
"history"
).innerHTML=
history.join("");

document.getElementById(
"backtest"
).innerHTML=
`Rule Confidence:
${confidence()}%`;

let p1=
dragon()?80:50;

let p2=
dna12().length
>=10?75:55;

let p3=
trap()?40:70;

let p4=
pingpong()?75:60;

document.getElementById("p1").innerHTML=p1;
document.getElementById("p2").innerHTML=p2;
document.getElementById("p3").innerHTML=p3;
document.getElementById("p4").innerHTML=p4;

let top="P1";
let max=p1;

[
["P2",p2],
["P3",p3],
["P4",p4]
].forEach(x=>{
if(x[1]>max){
max=x[1];
top=x[0];
}
});

document.getElementById(
"top"
).innerHTML=
top;

}

render();

/* Draggable Dock */

const dock=
document.getElementById(
"dock"
);

let move=false;

dock.addEventListener(
"touchstart",
()=>move=true
);

dock.addEventListener(
"touchend",
()=>move=false
);

dock.addEventListener(
"touchmove",
e=>{

if(!move)return;

let t=
e.touches[0];

dock.style.left=
t.clientX+"px";

dock.style.top=
t.clientY+"px";

dock.style.bottom=
"auto";

});

</script>

</body>
</html>
