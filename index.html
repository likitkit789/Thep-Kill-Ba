<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign Tracker - DeathX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    background:#0b132b;
    color:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:40px 16px;
    gap: 24px;
}

.container{
    max-width:500px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 24px;
}

h1{
    text-align:center;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

h1 span {
    font-size: 14px;
    color: #f59e0b;
    background: rgba(245, 158, 11, 0.2);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
}

.card{
    background:#1c2541;
    border-radius:16px;
    padding:20px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
    border: 1px solid #2a3a5e;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card-title {
    color: #8d99ae; 
    font-size: 14px;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* กล่องแสดงสถิติดิบ (b/p) */
.raw-stats-container {
    background: #0f1833;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a3a5e;
    min-height: 42px;
    display: flex;
    align-items: center;
}

#rawStats {
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    color: #cbd5e1;
    letter-spacing: 2px;
    word-break: break-all;
    font-weight: bold;
}

/* กล่องแสดงคำทำนาย DeathX */
.prediction-box {
    background: #0f1833;
    padding: 14px 12px;
    border-radius: 12px;
    border: 1px solid #f59e0b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    font-size: 26px;
    box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.1);
}

/* ส่วนแสดงผลเครื่องหมายแบบแถวยาว เลื่อนทางซ้าย */
.history-container {
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    background: #0b132b;
    padding: 16px 12px;
    border-radius: 12px;
    border: 1px solid #2a3a5e;
    scrollbar-width: thin;
    scrollbar-color: #3a506b transparent;
    min-height: 70px;
    display: flex;
    align-items: center;
}

#history {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 5px;
    font-family: 'Courier New', Courier, monospace;
    display: inline-block;
    line-height: 1;
}

/* สีแยกสำหรับเครื่องหมายประวัติ + / - */
.sign-plus {
    color: #ef4444;
    text-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
}

.sign-minus {
    color: #3b82f6;
    text-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
}

/* แผงปุ่มกดด้านล่าง */
.dock {
    background: #1c2541;
    border-radius: 20px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border: 1px solid #2a3a5e;
}

.dock button {
    border: none;
    height: 60px;
    border-radius: 14px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s active;
    -webkit-tap-highlight-color: transparent;
}

.dock button:active {
    transform: scale(0.95);
}

.btn-p {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.btn-b {
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

.btn-g {
    background: #374151;
    color: #d1d5db;
}

.btn-g:active {
    background: #4b5563;
}
</style>
</head>
<body>

<div class="container">
    <h1>
        📊 Sign Tracker
        <span>⚡ DeathX Engine</span>
    </h1>

    <div class="card">
        
        <!-- ส่วนทำนายผล DeathX -->
        <div>
            <div class="card-title">DeathX Prediction (3 Next)</div>
            <div class="prediction-box" id="deathxBox">
                ⏳ ⏳ ⏳
            </div>
        </div>

        <div>
            <div class="card-title" style="margin-top: 4px;">Recent Stats (b / p)</div>
            <div class="raw-stats-container">
                <div id="rawStats"></div>
            </div>
        </div>

        <div>
            <div class="card-title" style="margin-top: 4px;">History Signs (+ / -)</div>
            <div class="history-container" id="scrollBox">
                <div id="history"></div>
            </div>
        </div>

    </div>

    <!-- ปุ่มควบคุม -->
    <div class="dock">
        <button class="btn-p" onclick="add('P')">🔵 -</button>
        <button class="btn-b" onclick="add('B')">🔴 +</button>
        <button class="btn-g" onclick="undo()">↩</button>
        <button class="btn-g" onclick="resetAll()">✕</button>
    </div>
</div>

<script>
let historyData = JSON.parse(localStorage.getItem("baccarat_signs_v3") || "[]");

historyData = historyData.map(item => {
    if(item === '+') return 'B';
    if(item === '-') return 'P';
    return item;
});

function save(){
    localStorage.setItem("baccarat_signs_v3", JSON.stringify(historyData));
}

function add(symbol){
    historyData.push(symbol);
    save();
    render();
}

function undo(){
    historyData.pop();
    save();
    render();
}

function resetAll(){
    historyData = [];
    save();
    render();
}

// === ตรรกะ DeathX Engine ===
function calculateDeathX(data) {
    if (data.length < 3) return ["⏳", "⏳", "⏳"];

    // วิเคราะห์ข้อมูลย้อนหลัง 15 รอบ
    let recent = data.slice(-15);
    let p_weight = 0;
    let b_weight = 0;

    // การคำนวณ Weighted Probability: ให้ผลลัพธ์ล่าสุดมีน้ำหนักมากที่สุด
    for (let i = 0; i < recent.length; i++) {
        let weight = i + 1; // ตัวที่เก่าสุด = 1, ตัวใหม่สุด = 15
        if (recent[i] === 'B') b_weight += weight;
        if (recent[i] === 'P') p_weight += weight;
    }

    let last4 = data.slice(-4).join('');
    let next1, next2, next3;

    // Adaptive Prediction & 4inrow strategy
    if (last4 === 'BBBB' || last4 === 'PPPP') {
        // หากเกิดมังกร 4 ตัวติด ระบบสลับแพทเทิร์นป้องกันความผันผวน
        next1 = (last4 === 'BBBB') ? 'P' : 'B';
        next2 = (last4 === 'BBBB') ? 'B' : 'P';
        next3 = next1;
    } else if (last4 === 'BPBP' || last4 === 'PBPB') {
        // หากเกิดปิงปอง ให้สลับตามเทรนด์ต่อไป
        next1 = (last4 === 'BPBP') ? 'B' : 'P';
        next2 = (next1 === 'B') ? 'P' : 'B';
        next3 = (next2 === 'B') ? 'P' : 'B';
    } else {
        // หากรูปแบบไม่ชัดเจน ใช้น้ำหนักความน่าจะเป็น
        next1 = (b_weight >= p_weight) ? 'B' : 'P';
        next2 = (next1 === 'B') ? 'P' : 'B';
        next3 = (next2 === 'B') ? 'P' : 'B';
    }

    return [next1, next2, next3];
}

function render(){
    const rawEl = document.getElementById("rawStats");
    const historyEl = document.getElementById("history");
    const scrollBox = document.getElementById("scrollBox");
    const deathxBox = document.getElementById("deathxBox");
    
    if (historyData.length === 0) {
        rawEl.innerHTML = '<span style="color:#4b5563; font-weight:normal;">ยังไม่มีข้อมูล</span>';
        historyEl.innerHTML = '<span style="color:#4b5563; font-size:16px; font-weight:normal;">ยังไม่มีข้อมูล</span>';
        deathxBox.innerHTML = '⏳ ⏳ ⏳';
    } else {
        // สถิติดิบ
        rawEl.innerText = historyData.join("").toLowerCase();

        // ประวัติ + / -
        historyEl.innerHTML = historyData.map(item => {
            if (item === 'B') return '<span class="sign-plus">+</span>';
            if (item === 'P') return '<span class="sign-minus">-</span>';
            return item;
        }).join('');

        // อัปเดตคำทำนาย DeathX
        let predictions = calculateDeathX(historyData);
        deathxBox.innerHTML = predictions.map(p => {
            if (p === 'B') return '🔴';
            if (p === 'P') return '🟦';
            if (p === 'T') return '🟩';
            return p;
        }).join(' ');
    }

    scrollBox.scrollLeft = scrollBox.scrollWidth;
}

render();
</script>

</body>
</html>
